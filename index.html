<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Document</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        object {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <object data="Martin Matrix Array Block.pdf" type="application/pdf">
        <p>Your browser does not support embedded PDFs. 
           <a href="Martin Matrix Array Block.pdf">Click here to download the PDF instead.</a>
        </p>
    </object>
</body>
</html>
